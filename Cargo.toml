[workspace]
resolver = "2"
members = [
    "crates/image",
    "crates/layout",
    "crates/registry",
    "crates/auth",
    "crates/testing",
    "crates/cli-crane",
    "crates/cli-gcrane",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/arcbox-labs/containerregistry-rs"

[workspace.dependencies]
# Workspace crates
containerregistry-image = { version = "0.1.0", path = "crates/image" }
containerregistry-layout = { version = "0.1.0", path = "crates/layout" }
containerregistry-registry = { version = "0.1.0", path = "crates/registry" }
containerregistry-auth = { version = "0.1.0", path = "crates/auth" }
containerregistry-testing = { version = "0.1.0", path = "crates/testing" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Crypto (for digest computation)
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP utilities
httpdate = "1"

# Testing
tempfile = "3"
flate2 = "1"
zstd = "0.13"
